name: Retirement receipt native api.v1 integration
on:
  push:
    branches: [yaole/verify-retirement-integration-20261121]
permissions:
  contents: read
jobs:
  current-core-native-abort:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '7f5719c1ba688d757286214399d0e067831be2d1'
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake nasm
      - name: Install repository-pinned Rust and protoc
        run: bash scripts/ci/utils/install_rust_protoc.sh
      - name: Restore native Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: retirement-native-review
          save-if: false
      - name: Verify exact current core and native wait-rejection routes
        working-directory: rust
        run: |
          test "$(git rev-parse HEAD)" = '7f5719c1ba688d757286214399d0e067831be2d1'
          git rev-parse HEAD HEAD:rust
          rustc --version
          cargo test --locked -p sglang-server --lib api_server::http::info::tests::abort_request -- --nocapture
