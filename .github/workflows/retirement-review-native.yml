name: Retirement receipt native route check
on:
  push:
    branches: [yaole/verify-retirement-20261115]
permissions:
  contents: read
jobs:
  native-route:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake nasm
      - name: Install repository-pinned Rust and protoc
        run: bash scripts/ci/utils/install_rust_protoc.sh
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: retirement-native-review
      - name: Record source and run actual native abort routes
        working-directory: rust
        run: |
          git rev-parse HEAD HEAD:rust
          rustc --version
          cargo test --locked -p sglang-server --lib api_server::http::info::tests::abort_request -- --nocapture
